name: Test Parallels runner

on:
  workflow_dispatch:
  pull_request:

jobs:
  test:
    # Skip PRs from forks: this repo is public and the runner is self-hosted
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, macOS, parallels-vm]

    steps:
      - name: Check VM environment
        run: |
          hostname
          whoami
          date

